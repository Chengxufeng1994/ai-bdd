# Only port/out is listed. Driven ports are what the application needs the
# outside world to satisfy, and they are the only things worth mocking. The
# driving ports in port/in are generic and implemented by our own handlers — a
# mock of one would test the mock.

all: false
recursive: true

# Mocks live beside the interface they stand in for, in their own package, so
# that importing them cannot pull test doubles into a production build path.
dir: "{{.InterfaceDir}}/mocks"
filename: "mocks.go"
pkgname: "mocks"
structname: "{{.InterfaceName}}"

formatter: goimports
force-file-write: true
log-level: info

# testify mocks match the assertion library the tests already use.
template: testify

packages:
  skeleton/internal/application/port/out:
    config:
      all: true
