# mockery v3 — mocks for the ports the application layer declares.
#
# Only port/out is listed. Driven ports are what the application needs the
# outside world to satisfy, and they are the only things worth mocking. The
# driving ports in port/in are generic and implemented by our own handlers — a
# mock of one would test the mock.
#
# `domain` deliberately has no dependencies to stand in for — if a domain type
# ever needs a mock, the dependency rule has been broken and the fix is in the
# design, not here.
#
# `interfaces` is not listed either: those are generated adapters with a real
# implementation one line away, so a mock would test the mock.
#
# One port exists: out.VersionProvider. It has a single method, so its tests use
# a hand-written stub rather than the generated mock — see the note on keeping
# ports small in internal/application/doc.go. The mock is generated anyway,
# because the pipeline being exercised is what makes the next port free.

all: false
recursive: true

# Mocks live beside the interface they stand in for, in their own package, so
# that importing them cannot pull test doubles into a production build path.
dir: "{{.InterfaceDir}}/mocks"
filename: "mocks.go"
pkgname: "mocks"
structname: "{{.InterfaceName}}"

formatter: goimports
force-file-write: true
log-level: info

# testify mocks match the assertion library the tests already use.
template: testify

packages:
  skeleton/internal/application/port/out:
    config:
      all: true
